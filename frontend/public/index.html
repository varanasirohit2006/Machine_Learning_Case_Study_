<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Manufacturing ML Capstone</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Tailwind CSS Play CDN with theme extension -->
  <script>
    tailwind = {
      theme: {
        extend: {
          colors: {
            'surface-1': '#0f172a',
            'surface-2': '#1e293b',
            'surface-3': '#334155',
          }
        }
      }
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React + ReactDOM (loads local bundle first, falls back to CDN) -->
  <script src="vendor/react.production.min.js"></script>
  <script>window.React || document.write('<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"><\/script>')</script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script>window.ReactDOM || document.write('<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"><\/script>')</script>
  <!-- Chart.js -->
  <script src="vendor/chart.umd.min.js"></script>
  <script>window.Chart || document.write('<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"><\/script>')</script>
  <!-- Analysis data (from notebook outputs + app_metadata.json) -->
  <script src="data.js"></script>
  <script src="featureMeta.js"></script>
</head>
<body>
  <div id="root">
    <div style="display:flex;justify-content:center;align-items:center;height:100vh;color:#7dd3fc;font-family:sans-serif;font-size:1.25rem;">
      Loading Smart Manufacturing ML Dashboard...
    </div>
  </div>
  <!-- Compiled application bundle (runs instantly on both http:// and file:///) -->
  <script src="app.bundle.js"></script>
</body>
</html>
